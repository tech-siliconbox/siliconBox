[project]
name = "siliconbox-solver"
version = "0.1.0"
description = "Private formal-verification service for SiliconBox. Only the SiliconBox backend may call it."
requires-python = ">=3.12"
dependencies = [
  "defusedxml==0.7.1",
  "fastapi==0.163.1",
  "pydantic-settings==2.16.3",
  "pyjwt==2.15.1",
  # Praman's SystemVerilog and SVA front end (app/praman/services/sva, ADR 0031). MIT.
  "pyslang==12.0.0",
  "redis==8.1.0",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
# click: SymbiYosys needs it when run from this virtualenv on a developer machine.
dev = ["click==8.5.1", "fakeredis==2.40.0", "httpx2==2.16.2", "pytest==9.2.0", "ruff==0.17.5", "vulture==2.16"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ANN", "SIM", "RET", "PTH", "C90"]
ignore = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S105", "S106"]
# The SVA engine imported from formal-verify-backend keeps its original style; security rules
# (S) still apply. New code goes in other modules under the full rule set.
"app/engine/{sva_parser,sva_lowering,sv_preprocessor,sby_generator,vcd}.py" = [
  "ANN", "C901", "E501", "PTH", "RET504", "SIM102", "SIM105",
]
# Praman (see [tool.ruff.format]). S603/S607: its tools are fixed argument lists run by name from
# the image's PATH, inside the session container; S110/S112: deliberate best-effort reads.
"app/praman/{commands,conn,coverage,deadend,elab,jobs,session,sources,split,tclhost,tclprops}.py" = [
  "ANN", "B007", "B008", "B023", "B904", "B905", "C901", "E402", "E501", "E731", "E741", "I001", "PTH",
  "RET", "S110", "S112", "S603", "S607", "SIM", "UP",
]
"app/praman/{services,engine}/**" = [
  "ANN", "B007", "B008", "B023", "B904", "B905", "C901", "E402", "E501", "E731", "E741", "I001", "PTH",
  "RET", "S105", "S110", "S112", "S603", "S607", "SIM", "UP",
]
"tests/praman/{test_*.py,session/test_*.py,session/designs.py,engine/test_*.py}" = [
  "ANN", "B007", "B008", "B023", "B904", "B905", "C901", "E402", "E501", "E731", "E741", "I001", "PTH",
  "RET", "S105", "S108", "S307", "S311", "S603", "S607", "SIM", "UP",
]

# Praman, ported from formal-verify at 1bfa69ba (ADR 0031), keeps its original layout so later
# upstream changes can be compared and ported line by line: it is not reformatted, and only style
# rules are relaxed for it. Correctness (F), the remaining bugbear rules and the security rules (S)
# still apply. SiliconBox's own modules beside it (store.py, host.py, the conftests) get every rule.
[tool.ruff.format]
exclude = [
  "app/praman/{commands,conn,coverage,deadend,elab,jobs,session,sources,split,tclhost,tclprops}.py",
  "app/praman/services/**",
  "app/praman/engine/**",
  "tests/praman/{test_*.py,session/test_*.py,session/designs.py,engine/test_*.py}",
]

[tool.vulture]
paths = ["app", "tests"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
