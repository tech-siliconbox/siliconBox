name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm naming:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:entitlements
      - run: pnpm dedupe:check
      - run: pnpm unused:check
      - run: pnpm deps:check
      - name: Build
        # Placeholders only: the build must never need real secrets.
        env:
          PAYLOAD_SECRET: ci-build-placeholder-not-a-secret-000000
          MONGODB_URI_ADMIN: mongodb://127.0.0.1:27017/siliconbox_build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI_APP: mongodb://127.0.0.1:27017/siliconbox_ci?replicaSet=rs0&directConnection=true
      MONGODB_URI_ADMIN: mongodb://127.0.0.1:27017/siliconbox_ci?replicaSet=rs0&directConnection=true
      MONGODB_URI_ANSWERS: mongodb://127.0.0.1:27017/siliconbox_ci?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_URL: http://localhost:3000
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 1 && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Build and run end-to-end tests
        run: |
          export BETTER_AUTH_SECRET="$(openssl rand -base64 48)"
          export PAYLOAD_SECRET="$(openssl rand -base64 48)"
          pnpm build
          pnpm --filter @siliconbox/web exec playwright install --with-deps chromium
          pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  solver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/solver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install -U pip && .venv/bin/pip install -e . --group dev
      - run: .venv/bin/ruff check . && .venv/bin/ruff format --check . && .venv/bin/vulture
      - run: .venv/bin/pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --no-banner
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency scan (web)
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependency scan (solver)
        working-directory: apps/solver
        run: python -m venv .venv && .venv/bin/pip install -U pip && .venv/bin/pip install -e . pip-audit && .venv/bin/pip-audit --skip-editable
